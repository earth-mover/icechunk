[package]
name = "icechunk-wasm-tests"
version = "0.0.0"
description = "Runtime tests for icechunk on wasm32-unknown-unknown (browsers)"
edition.workspace = true
rust-version.workspace = true
publish = false

# Everything is gated on the browser target, so on other targets this crate
# is empty. Run with:
#   cargo test -p icechunk-wasm-tests --target wasm32-unknown-unknown
# (needs `wasm-bindgen-test-runner` as the cargo runner, see the Justfile).
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
icechunk = { path = "../icechunk", default-features = false }
icechunk-storage.workspace = true

async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["sync"] }
typetag.workspace = true

js-sys = "0.3.91"
wasm-bindgen-futures = "0.4.64"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
serde_json.workspace = true
wasm-bindgen-test = "0.3.64"

[lints]
workspace = true
