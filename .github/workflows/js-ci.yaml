name: JS CI

env:
  DEBUG: napi:*
  APP_NAME: icechunk
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_INCREMENTAL: "1"
  PIXI_VERSION: "v0.82.1"

on:
  push:
    branches:
      - main
      - "support/**"
    paths:
      - "icechunk/**"
      - "icechunk-js/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "icechunk/**"
      - "icechunk-js/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: ${{ matrix.settings.shell || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            # setup-pixi cannot activate an environment on windows, so the shell
            # wraps every command. `pwsh -Command {0}` silently runs nothing, so
            # this uses the Git bash that the runner image ships.
            shell: pixi run -m icechunk-python/pyproject.toml -e js bash -e {0}
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: false
          activate-environment: ${{ matrix.settings.host != 'windows-latest' }}
          manifest-path: icechunk-python/pyproject.toml
          environments: js
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          # pixi.lock pins rustc, so a toolchain bump invalidates the cache
          key: ${{ matrix.settings.target }}-${{ hashFiles('icechunk-python/pixi.lock') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unshadow the MSVC linker
        # Git bash puts a GNU `link` ahead of MSVC's link.exe on PATH, and rustc
        # picks the wrong one.
        if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe
      # napi builds for the host when no target is given, and each lane runs
      # on its target, so no target argument is needed.
      - name: Build
        run: just js-build
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bindings-${{ matrix.settings.target }}
          path: icechunk-js/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  build-linux-gnu:
    name: stable - ${{ matrix.target }} - node@22
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # built on arm64 so the napi-cross toolchain's target is the host,
          # as the aws-lc-sys workaround below needs
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        working-directory: ./icechunk-js
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: icechunk-js/yarn.lock
      - name: Install rust
        # the runner image ships an older stable; track the current one
        run: rustup update stable --no-self-update && rustup default stable
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup toolchain
        # The napi-cross toolchain ships GCC 4.8 which lacks C11
        # <stdatomic.h>, breaking aws-lc-sys. Use cmake builder with
        # system GCC override for that crate only.
        run: |
          echo "AWS_LC_SYS_CMAKE_BUILDER=1" >> $GITHUB_ENV
          echo "AWS_LC_SYS_TARGET_CC=gcc" >> $GITHUB_ENV
          echo "AWS_LC_SYS_TARGET_CXX=g++" >> $GITHUB_ENV
        shell: bash
      - name: Install dependencies
        run: yarn install
      - name: Build
        run: yarn build --target ${{ matrix.target }} --use-napi-cross
        shell: bash
      - name: Report the glibc the binding needs
        # aws-lc compiles against the host headers, so check the real baseline
        run: |
          echo "${{ matrix.target }}: needs $(objdump -T ${{ env.APP_NAME }}.*.node | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: icechunk-js/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@22
    needs:
      - build
    defaults:
      run:
        shell: ${{ matrix.settings.shell || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            # setup-pixi cannot activate an environment on windows, so the shell
            # wraps every command. `pwsh -Command {0}` silently runs nothing, so
            # this uses the Git bash that the runner image ships.
            shell: pixi run -m icechunk-python/pyproject.toml -e js bash -e {0}
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: false
          activate-environment: ${{ matrix.settings.host != 'windows-latest' }}
          manifest-path: icechunk-python/pyproject.toml
          environments: js
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ./icechunk-js
      - name: Test bindings
        run: just js-test

  test-linux-binding:
    name: Test bindings on ${{ matrix.target }} - node@22
    needs:
      - build-linux-gnu
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: false
          activate-environment: true
          manifest-path: icechunk-python/pyproject.toml
          environments: js
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: bindings-${{ matrix.target }}
          path: ./icechunk-js
      - name: Test bindings
        run: just js-test

  build-browser:
    # `@earthmover/icechunk/web`: the wasm-bindgen build for wasm32-unknown-unknown.
    # Built once here; test-browser tests this artifact and publish ships it.
    name: Build browser target (wasm-bindgen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Read the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install just and wasm-bindgen
        uses: taiki-e/install-action@v2.90.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # the CLI must match the wasm-bindgen crate exactly
          tool: just,wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}
      - name: Install Rust target
        run: rustup target add wasm32-unknown-unknown
      - name: Install LLVM toolchain for wasm C deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: js-browser
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: just js-build-browser browser-release
      - name: Report size
        run: |
          wasm=icechunk-js/wasm-bindgen/web/icechunk_js_bg.wasm
          echo "icechunk_js_bg.wasm: $(stat -c %s "$wasm") bytes, $(gzip -c "$wasm" | wc -c) gzipped" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          # not `bindings-*`: those are napi's, collected by `yarn artifacts`
          name: browser-wasm-bindgen
          path: |
            icechunk-js/wasm-bindgen/web/icechunk_js.js
            icechunk-js/wasm-bindgen/web/icechunk_js.d.ts
            icechunk-js/wasm-bindgen/web/icechunk_js_bg.wasm
            icechunk-js/wasm-bindgen/web/package.json
          if-no-files-found: error

  test-browser:
    name: Test browser target (wasm-bindgen)
    needs:
      - build-browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: taiki-e/install-action@v2.90.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: just
      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Download artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: browser-wasm-bindgen
          path: ./icechunk-js/wasm-bindgen/web
      - name: Test bindings
        run: just js-test-browser
      - name: Check types against index.d.ts
        working-directory: ./icechunk-js
        run: yarn check:web-types
      - name: Check the npm package includes the browser build
        working-directory: ./icechunk-js
        run: |
          # `prepare` (husky) runs even for a dry run and prints before the JSON
          files=$(npm pack --dry-run --json | node -e 'const out = require("fs").readFileSync(0, "utf8"); for (const f of JSON.parse(out.slice(out.indexOf("[")))[0].files) console.log(f.path)')
          for f in web.mjs web.d.ts web-init.mjs web-init.d.ts wasm-bindgen/web/icechunk_js.js wasm-bindgen/web/icechunk_js_bg.wasm wasm-bindgen/web/package.json fetch-storage-backend.mjs; do
            echo "$files" | grep -qx "$f" || { echo "missing from the package: $f"; exit 1; }
          done

  publish:
    name: Publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./icechunk-js
    permissions:
      contents: write # to publish the release
      id-token: write # for npm provenance attestation
    needs:
      - test-macOS-windows-binding
      - test-linux-binding
      - test-browser
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: icechunk-js/yarn.lock
      - name: Install dependencies
        run: yarn install
      - name: Create npm dirs
        run: yarn napi create-npm-dirs
      - name: Include licenses in npm packages
        run: |
          cp --remove-destination ../LICENSE ./LICENSE
          for package_dir in npm/*/; do
            cp --remove-destination ../LICENSE "${package_dir}LICENSE"
          done
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: bindings-*
          path: ./icechunk-js/artifacts
      - name: Download the browser build
        uses: actions/download-artifact@v8.0.2
        with:
          name: browser-wasm-bindgen
          path: ./icechunk-js/wasm-bindgen/web
      - name: Move artifacts
        run: yarn artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Publish
        run: |
          npm config set provenance true
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
          VERSION=$(node -p "require('./package.json').version")
          if echo "$VERSION" | grep -q "-"; then
            TAG=${VERSION%%-*}; TAG=${VERSION#"$TAG"-}; TAG=${TAG%%.*}
            npm publish --access public --tag "$TAG"
          else
            npm publish --access public
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
