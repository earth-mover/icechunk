name: Rust Check - Upstream (zarrs)

on:
  push:
    branches:
      - main
      - "support/**"
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  schedule:
    - cron: "0 1 * * *" # Daily at 01:00 UTC
  workflow_dispatch:

concurrency:
  # event_name keeps a push to main from cancelling the running nightly
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  PIXI_VERSION: "v0.72.0"
  # Title of the issue the report job keeps up to date. Pinned here so the
  # comment step below can find that issue.
  ZARRS_ISSUE_TITLE: "Nightly zarrs upstream test failed"

jobs:
  zarrs:
    name: zarrs-upstream
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      build-outcome: ${{ steps.build.outcome }}
      test-outcome: ${{ steps.test.outcome }}
    if: ${{
      (contains(github.event.pull_request.labels.*.name, 'test-upstream') && github.event_name == 'pull_request')
      || github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || github.event_name == 'push'
      }}
    steps:
      - name: Checkout icechunk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cargo cache: the build is dominated by icechunk itself, which is a path
      # dependency and never cached, so the 800 MB entry saved no measurable time.
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: false
          activate-environment: true
          manifest-path: icechunk-python/pyproject.toml

      - name: clone zarrs_icechunk
        run: |
          just zarrs-upstream-clone

      - name: Patch zarrs_icechunk to use local icechunk
        run: |
          just zarrs-upstream-patch

      - name: Build zarrs_icechunk
        id: build
        run: |
          just zarrs-upstream-build

      - name: Test zarrs_icechunk
        id: test
        if: steps.build.outcome == 'success'
        run: |
          just zarrs-upstream-test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zarrs-upstream-logs
          path: |
            zarrs_icechunk/build-output.log
            zarrs_icechunk/test-output.log
          if-no-files-found: ignore

  zarrs-report:
    name: zarrs-upstream-report
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: zarrs
    permissions:
      issues: write # needed to create/update failure issues when nightly tests fail
    if: |
      always()
      && (needs.zarrs.outputs.build-outcome == 'failure' || needs.zarrs.outputs.test-outcome == 'failure')
      && github.event_name == 'schedule'
      && github.repository_owner == 'earth-mover'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: zarrs-upstream-logs
          path: zarrs_icechunk

      - name: Create or update failure issue
        shell: bash
        run: |
          # Combine build and test output
          test_output="=== Build Output ===
          "
          if [ -f "zarrs_icechunk/build-output.log" ]; then
            test_output+=$(tail -100 zarrs_icechunk/build-output.log)
          else
            test_output+="No build output captured"
          fi

          test_output+="

          === Test Output ===
          "
          if [ -f "zarrs_icechunk/test-output.log" ]; then
            test_output+=$(tail -100 zarrs_icechunk/test-output.log)
          else
            test_output+="No test output captured"
          fi

          # Fill the template. Bash ${var//pat/repl} expands an `&` in the
          # replacement to the matched text, which corrupts compiler output.
          issue_body=$(
            WORKFLOW="$WORKFLOW_NAME" DATE="$(date -u)" TEST_OUTPUT="$test_output" \
            python3 - <<'PY'
          import os

          template = open(".github/zarrs-upstream-failure-template.md").read()
          for key in ("WORKFLOW", "RUN_ID", "RUN_URL", "DATE", "TEST_OUTPUT"):
              template = template.replace("{{%s}}" % key, os.environ[key])
          print(template, end="")
          PY
          )

          # Check for existing open issue with same title
          issue_title="$ZARRS_ISSUE_TITLE"
          existing_issue=$(gh issue list --state open --label "CI" --search "\"$issue_title\" in:title" --json number --jq '.[0].number // empty')

          if [ -n "$existing_issue" ]; then
            echo "Found existing open issue #$existing_issue, updating it..."
            echo "$issue_body" | gh issue edit "$existing_issue" --body-file -
            echo "Updated existing issue #$existing_issue"
          else
            echo "No existing open issue found, creating new one..."
            echo "$issue_body" | gh issue create \
              --title "$issue_title" \
              --body-file - \
              --label "CI"
            echo "Created new issue"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

        # The step above rewrites the issue body. GitHub notifies nobody of that
        # change. Post a comment so the issue watchers see the new failure.
      - name: Comment on the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --limit 200 --json number,title |
            jq -r --arg t "$ZARRS_ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -z "$number" ]; then
            echo "no open issue titled '$ZARRS_ISSUE_TITLE'"
            exit 0
          fi
          gh issue comment "$number" --body \
            "Failed again in tonight's run: $RUN_URL. The issue body has the current failures."

  zarrs-close:
    name: zarrs-upstream-close
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: zarrs
    permissions:
      issues: write # needed to close the failure issue once the nightly passes again
    if: |
      needs.zarrs.outputs.build-outcome == 'success'
      && needs.zarrs.outputs.test-outcome == 'success'
      && github.event_name == 'schedule'
      && github.repository_owner == 'earth-mover'
    steps:
      - name: Close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --limit 200 --json number,title |
            jq -r --arg t "$ZARRS_ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')
          if [ -z "$number" ]; then
            echo "no open issue titled '$ZARRS_ISSUE_TITLE'"
            exit 0
          fi
          gh issue close "$number" --comment \
            "The nightly passed again: $RUN_URL. Closing. A later failure opens a new issue."
