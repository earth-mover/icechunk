name: Windows tests
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  merge_group:
  push:
    branches:
      - main
      - 'support/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # don't cancel main runs: the post-job cache saves only happen there
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CI: 1
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10
  PIXI_VERSION: "v0.72.0"

jobs:
  rust:
    name: Run rust tests in windows
    timeout-minutes: 20
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # The rust-cache restore and cargo's crate unpacking run about 3x faster
      # on D: (the workspace disk) than on the C: OS disk.
      - name: Keep the cargo home on the D drive
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "CARGO_HOME=$env:RUNNER_TEMP\cargo-home"

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # The rust cache includes a dep on the Python version (when building icechunk-python)
          # so we need to bump the version here whenever Python version is updated
          # Currently: 3.12
          prefix-key: "rust-py312"
          # cargo comes from pixi.lock, which the key does not otherwise see
          shared-key: "rust-${{ hashFiles('icechunk-python/pixi.lock') }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}
          environments: rust-test
          manifest-path: icechunk-python/pyproject.toml
          # environment activation doesn't work on windows
          # https://github.com/prefix-dev/setup-pixi/issues/122#issuecomment-2326495414
          # activate-environment: true

      - name: Unshadow the MSVC linker
        # Git bash puts a GNU `link` ahead of MSVC's link.exe on PATH, and rustc
        # picks the wrong one.
        shell: bash
        run: rm -f /usr/bin/link.exe

      - name: Run tests
        # `pwsh -Command {0}` runs nothing and still exits 0. bash also gives
        # just the `sh` it needs for recipes.
        shell: pixi run -m icechunk-python/pyproject.toml -e rust-test bash -e {0}
        run: |
          just profile=ci unit-test
