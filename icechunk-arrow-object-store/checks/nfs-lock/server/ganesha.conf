NFS_CORE_PARAM {
    NFS_Port = 2049;
    # NFSv4 only. Its locking is part of the protocol, so no rpcbind, no statd
    # and no NLM sideband to stand up.
    NFS_Protocols = 4;
    Enable_NLM = false;
    Enable_RQUOTA = false;
    # PR_SET_IO_FLUSHER needs CAP_SYS_RESOURCE, which a plain container lacks.
    # It only protects against memory-reclaim deadlock under load.
    allow_set_io_flusher_fail = true;
}

NFSV4 {
    # Short lease and grace, so a restart does not stall the check.
    Lease_Lifetime = 10;
    Grace_Period = 10;
}

EXPORT {
    Export_Id = 1;
    Path = /export;
    Pseudo = /;
    Access_Type = RW;
    Squash = No_Root_Squash;
    Protocols = 4;
    Transports = TCP;
    SecType = sys;
    FSAL { Name = VFS; }
}

LOG {
    Default_Log_Level = EVENT;
}
