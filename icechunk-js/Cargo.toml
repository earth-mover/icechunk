
[package]
name = "icechunk-js"
version = "0.1.0"
description = "JavaScript/TypeScript bindings for icechunk"
repository = "https://github.com/earth-mover/icechunk"
license = "Apache-2.0"
keywords = ["zarr", "xarray", "database"]
categories = ["database", "science", "science::geo"]
authors = ["Earthmover PBC"]
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1", features = ["sync"] }
bytes = "1"
futures = "0.3"
serde_json = "1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
chrono = "0.4"
async-trait = "0.1.89"
typetag = "0.2.22"
rand = "0.10.1"
icechunk-storage = { path = "../icechunk-storage" }

# Node bindings (native and wasm32-wasip1-threads) use napi; the browser build
# (wasm32-unknown-unknown) uses wasm-bindgen. build.rs sets `cfg(browser)`.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
napi = { version = "3.9.0", features = ["async", "tokio_rt", "serde-json", "chrono_date"] }
napi-derive = "~3.5"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
icechunk = { path = "../icechunk" }

[target.'cfg(all(target_family = "wasm", not(target_os = "unknown")))'.dependencies]
icechunk = { path = "../icechunk", default-features = false, features = ["napi-send-contract"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
icechunk = { path = "../icechunk", default-features = false }
js-sys = "0.3.91"
send_wrapper = "0.6"
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11.19"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"

# `just wasm-browser-test`: src/browser/tests.rs under wasm-bindgen-test-runner
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3.64"

[build-dependencies]
napi-build = "~2.3"
