[package]
name = "icechunk-s3"
version = "2.3.1"
description = "Native AWS S3 storage backend for icechunk"
readme = "../README.md"
repository = "https://github.com/earth-mover/icechunk"
homepage = "https://icechunk.io"
license = "Apache-2.0"
keywords = ["zarr", "xarray", "database"]
categories = ["database", "science", "science::geo"]
authors = ["Earthmover PBC"]
edition.workspace = true
publish = true
rust-version.workspace = true

[features]
# Exposes `test_util` for cross-crate integration tests
test-util = []

[dependencies]
icechunk-storage.workspace = true
icechunk-types.workspace = true

async-trait.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-s3.workspace = true
aws-smithy-http-client.workspace = true
aws-smithy-runtime.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
aws-smithy-types-convert.workspace = true
bytes.workspace = true
chrono.workspace = true
futures.workspace = true
http.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time"] }
tokio-util.workspace = true
tower-service.workspace = true
tracing.workspace = true
typed-path.workspace = true
typetag.workspace = true
uuid.workspace = true

[dev-dependencies]
icechunk-macros.workspace = true

serde_json.workspace = true
test-log.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
tokio-rustls.workspace = true

[lints]
workspace = true
